site_name: "Machine Learning Specialization — Study Companion"
site_url: "http://127.0.0.1:8000/"
docs_dir: docs
use_directory_urls: true

# exercise sources + REM files are not standalone pages
exclude_docs: |
  **/*.py
  **/*_REM.md
# transcript pages are linked from their topic, not shown in the nav
not_in_nav: |
  **/*-transcript.md

theme:
  name: pyodide-mkdocs-theme
  custom_dir: overrides
  language: en
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Light mode }
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Dark mode }
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - extra.css

plugins:
  - search
  - pyodide_macros:
      on_error_fail: true
      build:
        ides_id_hash_mode: relative
      project:
        id: ml-spec
      # suppress PMT's auto-injected demo 'Playground' page (ships in French)
      playground:
        include: none

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.striphtml:
      strip_js_on_attributes: false
      strip_attributes: ""
  - toc:
      permalink: true

